name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  build_test_install:
    name: Windows | Build, Test, Install
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset ci-release

      - name: Build
        run: cmake --build --preset ci-release --verbose

      - name: Test
        run: ctest --preset ci-release --output-on-failure

      - name: Install
        run: cmake --install out/ci-release-modern --prefix out/install/windows

      - name: Package
        shell: pwsh
        run: |
          & scripts/package_windows_release.ps1 `
            -SourceRoot out/install/windows `
            -ArchivePath out/ci-release-modern/package/windows-package.zip `
            -ChecksumPath out/ci-release-modern/package/windows-package.zip.sha256

      - name: Install Inno Setup
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Create Windows installer
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          & scripts/package_windows_installer.ps1 `
            -Version "nightly" `
            -ArchivePath out/ci-release-modern/package/windows-installer.exe `
            -ChecksumPath out/ci-release-modern/package/windows-installer.exe.sha256

      - name: Upload install tree
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-tree
          path: out/install/windows

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: out/ci-release-modern/package/

      - name: Publish nightly release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          release_tag="nightly"
          release_title="Nightly"
          release_notes="Automated Windows build from ${GITHUB_SHA}"
          assets=(out/ci-release-modern/package/*.zip out/ci-release-modern/package/*.sha256 out/ci-release-modern/package/*.exe)

          if gh release view "$release_tag" >/dev/null 2>&1; then
            gh release upload "$release_tag" "${assets[@]}" --clobber
          else
            gh release create "$release_tag" \
              --title "$release_title" \
              --notes "$release_notes" \
              --target "$GITHUB_SHA" \
              --prerelease \
              "${assets[@]}"
          fi
