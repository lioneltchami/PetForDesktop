name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build_test_install:
    name: Windows | Build, Test, Install
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake --preset ci-release

      - name: Build
        run: cmake --build --preset ci-release --verbose

      - name: Test
        run: ctest --preset ci-release --output-on-failure

      - name: Install
        run: cmake --install out/ci-release-modern --prefix out/install/windows

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/ci-release-modern/package | Out-Null
          cpack --config out/ci-release-modern/CPackConfig.cmake -G ZIP -B out/ci-release-modern/package
          if (-not (Test-Path out/ci-release-modern/package/*.zip)) {
            throw "No package zip produced by CPack"
          }

      - name: Package checksum
        shell: pwsh
        run: |
          Get-ChildItem -Path out/ci-release-modern/package -Filter *.zip | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Out-File -FilePath "$($_.FullName).sha256" -Encoding utf8
          }

      - name: Upload install tree
        uses: actions/upload-artifact@v4
        with:
          name: windows-install-tree
          path: out/install/windows

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            out/ci-release-modern/package/*.zip
            out/ci-release-modern/package/*.sha256
